name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: elverse
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'

      - name: Install pnpm
        run: npm i -g pnpm@latest

      - name: Install dependencies
        run: pnpm install

      - name: Configure DATABASE_URL
        run: echo "DATABASE_URL=postgresql://postgres:pass@127.0.0.1:5432/elverse?schema=public" >> $GITHUB_ENV

      - name: Push Prisma schema
        working-directory: ./libs/database
        run: pnpm exec prisma db push --accept-data-loss

      - name: Generate Prisma client
        working-directory: ./libs/database
        run: pnpm exec prisma generate

      - name: Run tests
        run: pnpm test --silent

      - name: Build workspace
        run: pnpm build
